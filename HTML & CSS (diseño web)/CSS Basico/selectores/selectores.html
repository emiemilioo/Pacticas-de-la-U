<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectores</title>
    <link rel="stylesheet" href="selectores.css">
</head>
<body>
    <h1>TITULO</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quis rem, provident nam laborum voluptatem nisi cupiditate expedita quae nemo illum ea voluptas doloremque quo repellat eaque quisquam! Excepturi, unde nostrum.</p>
    <ul>
        <!--El atributo span ayuda a seleccionar algo muy puntual-->
        <li>Una taza de <span>Harina</span></li>

        <!--el atributo class ayuda a clasificar los elemento por ejemplo de una lista-->
        <li class="ingrediente-faltante">huevos</li>

        <!--el atributo id, da una identificacion a elementos, por ejemplo de una lista-->
        <li id="ingrediente-secreto">Leche</li>
    </ul>
</body>
</html>
