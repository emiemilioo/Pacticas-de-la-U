<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enlances</title>
</head>
<body>
    <!--La etiqueta es a que significa ancle, que hace referencia a las anclas que segun dicen que es algo que te ancla a algo y blabla-->
    <a>Enlance</a> 

    <!--AQjui para que sea funcional hay que aplicarles atributos propios de html-->
    <a href="https://www.youtube.com/watch?v=ELSm-G201Ls">Video de curso de HTML</a>

    <!--Actualmente no es necesario poner el https, esto porque tambien se trabaja con servidores locales basta con la siguiente forma-->
    <a href="//youtube.com/watch?v=ELSm-G201Ls"></a>
    <!--Aunque si es recomendable ya que es mas seguro, es una buena práctica-->

    <!--Si es un archivo local basta con el nombre-->
    <a href="listas.html">Listas</a>

    <!--Para brir enlances en otras pestañas lo que hacemos es lo siguiente-->
    <a href="listas.html" target="_blank">Listas pero en otra pestaña</a>
    <!--El valor por defecto de target es self-->

    <!--Ahora para ponerle un titulo al enlance al pasar el cursor se aplica el siguiente atributo-->
    <a href="listas.html" title="Enlance hacia listas">Listas pero con titulo al pasar el cursos</a>
    <!--Este atributo se puede aplicar a cualquier elemento, normalmente se aplica a imagenes para describirla o en enlances para dar información e incluso en botones-->
</body>
</html>
