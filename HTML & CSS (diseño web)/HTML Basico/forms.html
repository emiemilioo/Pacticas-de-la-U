<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form>
        <!--Hay atributos que se deberian estudiar, uno es value que es como el mensaje por defecto, hay que ver como funciona el value para todos los tipos de inputs-->
        <input type="text" value="escribe" required>
        <input type="week">
        <input type="color" value="Escoge">
        <input type="submit" value="Enviar">
        <input type="email">
        <input type="password">
        <input type="checkbox">
        <input type="radio">
        <input type="file">
        <input type="date">
        <input type="datetime">

        <!--hay mas atributos que son importantes para los inputs-->
        <!--el primero es required que obliga al usuario rellenar-->

        <!--el segundo es name, que define el nombre del campo, para que cuando el servidor reciba los datos del input sabra como se llama el campo y hacer verificaciones o hacer base de datos, es unico el name del campo-->

        <!--el tercero es un tributo visible, que es placeholder, es un texto por defecto que indica un ejemplo al usuario, es como el value pero que es un texto que se borra al rellenar el campo. No todos los inputs tienen esta propiedad--> 

        <!--el cuarto es value, que es lo que recibe el servidor-->

        <!--el quinto atributo son minlenght="int", que ayuda a oner un limite de letras en el campo-->

        <!--Las propiedades de form es ma spara trabajar con javaScript que recibe cosas-->
    </form>
</body>
</html>
