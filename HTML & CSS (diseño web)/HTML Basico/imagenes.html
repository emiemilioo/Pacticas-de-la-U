<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imágenes</title>
</head>
<body>
    <!--La etiqueta de imagenes es una que no necesita ser cerrada-->
    <img src="Imagen1.jpg" alt="Emilio en la charla Vortice" title="Emilio en la charla Vortice"> 
    <!--En este caso debemos poner la ruta pero si nuestra imagen esta en nuestra carpeta no hay problema-->
    <!--el atributo de alt nos ayuda a describir nuestra imagen en caso de que la imagen no cargue y tambien ayuda a posicionar la pagina en las busquedas, tipo la etiqueta H1-->

    <!--ahora si nuestras imagenes estan en otras rutas o en diferentes carpetas se utiliza la teoria de rutas-->
</body>
</html>
