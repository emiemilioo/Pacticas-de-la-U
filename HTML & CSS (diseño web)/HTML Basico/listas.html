<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <!--Listas Ordenadas-->
    <ol> <!--Esto significa ordened list-->
        <li>Elemento 1</li> <!--Esto significa list item-->
        <!--Automaticamente va a mostrarme tipo 1. siempre saldra el numero del elemento-->
    </ol>

    <!--Listas Desordenadas-->
    <ul>
        <li>Element 1</li>
        <li>Element 2</li>
    </ul>
</body>
</html>
