<!DOCTYPE html>
<html lang="es">
    <!--este es el lenguaje que nuestro navegdor va a sabe en que idoma esta trabajando -->
<head>
    <meta charset="UTF-8">
    <!--esto ya es nuestro meta tag permite todos los caracteres del mundo, ayuda que acentos o caracteres especiales sea aceptada para el navegador-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--la mayoria de los metatags tienen la etiqueta del name y content que es el name es el nombre que estan declarando o definiendo de a pagina y el contenido que es lo que nos quiere decirnos.
    Aqui estamos diciendo que el ancho de la pagia sera igual que el de los dispositivos
    El initial scale es para el tema del zoom, ayuda qiue el dispositivo entre sin un zoom, asi que si hago zoom y recargo se mostrar con un zoom normal-->

    <meta name="description" content="">
    <!--este meta ayuda a darle una descripccion a nuestra pagina de unos 100 caracteres -->

    <meta name="keywords" content="">
    <!--esto es para poder darle las palabras claves, es decir que si alguien busca estas palabras claves en el navegador, el navegador le dara priporidad o mas relevancia-->

    <meta name="author" content="Emilio Jaramillo">

<!--esta es una etiqueta para declarar el autor de la pagina :3-->

    <meta name="robots" content="">
    <!--es una etiqueta para que los motorres de busqueda indexe la pagina en las busquedas.
    
    si mi contenido es no follow no indexara el contneido en los moteres busqueda 
    
    si es nosnippet, pues basicamente no mostrara cotenido previo de nuestra pagina
    
    si es noarchive hace que nuestra pagina no pueda almacernar informacion en cache, pero esto tien ventajas y no ventjas pues si se guarda en cahce nuestronusuario podra cargar mas rapido la pagina, pero no se guarda en cache cuando nuestra pagina depende de los cambios y una pagiuna depende de cambios mcuhas veces-->

    <meta name="OG.Tittle" content="Hola">
    <!--Estos metatags son conocidos como open wrapped, que pues ayudan a que cuando lguien epgue en link de mi pagina, pueda configurar que sautomaticamente se genere un ink con una aimgen, titulo, pagina y descripcion, lo que pasa cuando compares un link en tw o ws sale ya de una el precontenido-->

   <!--una pagina para saber como se ve lo de los metatags es metatags.io--> 

    <title>Document</title>
